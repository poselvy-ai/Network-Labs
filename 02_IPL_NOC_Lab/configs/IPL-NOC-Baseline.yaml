- id: n4
  label: FW1
  node_definition: asav
  x: 0
  y: -100
  configuration: |
    hostname FW1
    interface GigabitEthernet0/0
     nameif outside
     security-level 0
     ip address 198.51.100.2 255.255.255.248
     no shutdown
    interface GigabitEthernet0/1
     nameif inside1
     security-level 100
     ip address 10.0.0.1 255.255.255.252
     no shutdown
    interface GigabitEthernet0/2
     nameif inside2
     security-level 100
     ip address 10.0.0.5 255.255.255.252
     no shutdown
    interface GigabitEthernet0/3
     nameif dmz
     security-level 50
     ip address 172.16.50.1 255.255.255.0
     no shutdown
    same-security-traffic permit inter-interface
    object network OBJ-INSIDE-NETS
     subnet 10.0.0.0 255.0.0.0
     nat (any,outside) dynamic interface
    object network OBJ-DMZ-SRV1
     host 172.16.50.10
     nat (dmz,outside) static 198.51.100.10
    access-list OUTSIDE-IN extended permit tcp any host 172.16.50.10 eq www
    access-list OUTSIDE-IN extended permit icmp any host 172.16.50.10 echo
    access-group OUTSIDE-IN in interface outside
    route outside 0.0.0.0 0.0.0.0 198.51.100.1
    router ospf 1
     router-id 10.255.255.254
     network 10.0.0.0 255.255.255.252 area 0
     network 10.0.0.4 255.255.255.252 area 0
     network 172.16.50.0 255.255.255.0 area 0
     log-adj-changes
     default-information originate
    class-map inspection_default
     match default-inspection-traffic
    policy-map global_policy
     class inspection_default
      inspect icmp
      inspect http
    service-policy global_policy global
    logging enable
    logging buffered informational
