     neighbor 203.0.113.1 route-map RM-ISP-A-IN in
     neighbor 203.0.113.1 prefix-list PL-IPL-OUT out
     neighbor 203.0.113.5 remote-as 65200
     neighbor 203.0.113.5 description ISP-B-BACKUP
     neighbor 203.0.113.5 prefix-list PL-IPL-OUT out
     neighbor 203.0.113.5 route-map RM-ISP-B-OUT out
    line con 0
