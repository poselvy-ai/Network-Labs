lab:
  title: IPL-NOC Lab - Ironwood Power & Light
  description: 'Tier 1 NOC troubleshooting lab: multi-area OSPF core, ASAv firewall (Palo Alto stand-in), dual-homed eBGP edge. Fictional client.'
  notes: Baseline (all working). Fault tickets are introduced separately.
  version: 0.2.2
nodes:
- id: n0
  label: ISP-A
  node_definition: iol-xe
  x: -400
  y: -400
  configuration: |-
    hostname ISP-A
    no ip domain lookup
    interface Loopback0
     ip address 100.64.1.1 255.255.255.255
    interface Ethernet0/0
     description TO-EDGE-R1
     ip address 203.0.113.1 255.255.255.252
     no shutdown
    interface Ethernet0/1
     description TO-INET
     ip address 203.0.113.9 255.255.255.252
     no shutdown
    router bgp 65100
     bgp router-id 100.64.1.1
     bgp log-neighbor-changes
     network 100.64.1.1 mask 255.255.255.255
     neighbor 203.0.113.2 remote-as 65001
     neighbor 203.0.113.2 description CUSTOMER-IPL
     neighbor 203.0.113.10 remote-as 65300
     neighbor 203.0.113.10 description INTERNET
    line con 0
     logging synchronous
     exec-timeout 0 0
    end
  tags: []
  interfaces:
  - id: i0
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i1
    label: Ethernet0/1
    slot: 1
    type: physical
